name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-idf:
    name: build-idf
    runs-on: ubuntu-latest
    # Initial ceiling, not a measurement. The #202 measurement run (Actions
    # 30498910795) compiled ~1751 ninja edges per mode in roughly 3 minutes on
    # this runner class, and this job does one such build plus an image pull, the
    # esptool merge, and four host steps that finish in seconds. 30 leaves a wide
    # margin for a cold registry pull while still turning a hung build into a
    # failure inside half an hour instead of GitHub's 6-hour default. Revisit with
    # the wall time from the first real run (see the ADR).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag or CMakeLists
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep 'set(PROJECT_VER' idf_app/CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building firmware version: $VERSION"

      - name: Inject version into CMakeLists.txt
        run: |
          sed -i 's/set(PROJECT_VER ".*")/set(PROJECT_VER "${{ steps.version.outputs.version }}")/' idf_app/CMakeLists.txt
          grep PROJECT_VER idf_app/CMakeLists.txt

      # Enforcement is forced ON explicitly through the action's `command` input
      # (#202). It cannot be inherited from the environment: the CI variable does
      # not cross into the container, so the flag has to be on the idf.py command
      # line where it is visible in the workflow diff. The output is teed so the
      # host steps below can assert on it; pipefail + PIPESTATUS preserve idf.py's
      # real exit status, which `tee` would otherwise swallow.
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.4
          target: esp32s3
          path: idf_app
          command: >-
            set -o pipefail;
            idf.py -DRK_ENFORCE_RELEASE_CONFIG=ON build 2>&1 | tee rk-build.log;
            exit ${PIPESTATUS[0]}

      # This host assertion is what makes "this job cannot run UNENFORCED" true
      # rather than assumed: flipping the flag, deleting the checker, or removing
      # the CMake call all leave the report missing, unenforced, or describing
      # another config, and all three fail here.
      # tools/test_check_release_config.sh proves this assertion itself has teeth
      # (assert-the-assertion cases).
      # Scope that claim precisely -- an earlier version of this comment said "CI
      # cannot opt out", which is too broad. What holds: a job cannot run
      # unenforced, and publication is gated by real `needs:` edges. Both
      # publishing consumers now gate on the SAME set -- `release` and
      # `deploy-pr-preview` each declare `needs: [build-idf,
      # release-config-fixtures, build-stale-config]` -- so any one of the three
      # proof jobs red or skipped stops both a published firmware asset and a
      # flashable PR preview. Earlier versions of this comment described an
      # asymmetry (the preview path needing only two of the three); that gap is
      # closed, so do not re-derive it from this comment.
      # What does NOT hold at all: that CI blocks MERGING. Branch protection on
      # master currently has no required status checks, 0 required approvals and
      # enforce_admins off, so a maintainer can merge with these jobs red. Making
      # them required checks is a repo-settings change needing maintainer
      # authorization; see the ADR's "Enforcement ceilings" section.
      # The ESP-IDF container runs as root with no --user, so everything it created
      # under idf_app/build/ is root-owned on the host bind mount. Host `run:` steps
      # execute as `runner` and may therefore only READ in there. Anything a host
      # step needs to WRITE goes to $RUNNER_TEMP, which the runner owns and which is
      # outside the tree (so no .gitignore entry is needed and nothing can dirty the
      # working copy). Defined once here, consumed by name below, so the checker and
      # the asserter cannot drift onto different paths.
      - name: Define host-owned report path (#202)
        run: echo "RK_LOG_SCAN_REPORT=$RUNNER_TEMP/rk_log_scan_report.json" >> "$GITHUB_ENV"

      # --forbid-absent-satisfied is a caller-owned coverage floor, not a change to
      # what the checker decides. The checker correctly reads an absent
      # expected-false symbol as satisfied, which is indistinguishable from that
      # symbol having LEFT the SDK schema -- in which case the invariant stops being
      # checked and the report still says `pass`. This build's resolved config
      # currently reports every negative invariant as an explicit `false` (zero
      # absent_satisfied rows), so requiring zero is a statement about THIS build
      # that CI can pin: a future IDF bump that drops one of those symbols turns
      # build-idf red -- and with it both `release` and `deploy-pr-preview`, which
      # need this job -- instead of shrinking coverage silently. Distinguishing the
      # two causes of absence inside the checker needs active Kconfig evidence and
      # remains #206; this flag does not pre-empt it.
      - name: Assert the release config gate ran, enforced, and passed (#202)
        run: |
          python3 idf_app/tools/assert_release_report.py \
            --report idf_app/build/config/rk_release_config.json \
            --config idf_app/build/config/sdkconfig.json \
            --expect-enforced true \
            --expect-verdict pass \
            --forbid-absent-satisfied

      # Assignments to undefined kconfig symbols are kconfgen's verdict, not ours;
      # the checker only consumes its exact warning from the build log.
      #
      # Requesting a log makes its existence, non-emptiness AND identity part of
      # the contract. `--log-must-contain RK-RELCFG-VERDICT:` is what proves the
      # log read here is the one the gate itself wrote: if a future refactor
      # renames, moves or drops the `tee`, this step fails with exit 5 /
      # RK-RELCFG-NOLOG instead of passing vacuously on an absent log.
      - name: Assert no assignments to undefined kconfig symbols (#202)
        run: |
          python3 idf_app/tools/check_release_config.py \
            --config idf_app/build/config/sdkconfig.json \
            --log idf_app/rk-build.log \
            --log-must-contain 'RK-RELCFG-VERDICT:' \
            --enforced yes \
            --report "$RK_LOG_SCAN_REPORT"

      # ...and this proves the *report* records the log as read, so "no findings"
      # can never again be indistinguishable from "nothing was looked at".
      #
      # --expect-log-marker is supplied HERE, by the auditor, on purpose. The
      # report's own logs_required_markers is the artifact's claim about what was
      # asked of it: if a future edit drops --log-must-contain above, that list is
      # empty and any check driven from it passes by iterating nothing. The
      # expectation therefore has to come from the caller.
      # --expect-enforced/--expect-verdict are deliberately `any` here. This report
      # was produced by the previous step in this same job, so asserting that it
      # says `enforced: true` would only re-read this job's own input -- circular,
      # and proving nothing. The verdict of that scan is already enforced by the
      # step's exit code. What is worth asserting is the evidence the caller did
      # NOT supply: that a log was really read, and that it was the gate's own log.
      - name: Assert the undefined-symbol scan actually read the build log (#202)
        run: |
          python3 idf_app/tools/assert_release_report.py \
            --report "$RK_LOG_SCAN_REPORT" \
            --config idf_app/build/config/sdkconfig.json \
            --expect-enforced any \
            --expect-verdict any \
            --require-logs-read \
            --expect-log-marker 'RK-RELCFG-VERDICT:'

      # Evidence, published only after the assertions above have passed, so a
      # summary can never announce a verdict that was not also enforced. This is
      # what makes #189's release-blocking checklist satisfiable from CI output
      # instead of from someone's recollection. No firmware behaviour is involved:
      # the digest is of IDF's resolved config file, computed on the host, and #202
      # adds no firmware-reported digest (see the ADR's #203 handoff).
      # if: always() so the runs where evidence matters most -- the failing ones --
      # still publish what the gate saw. This cannot mask an earlier failure: a
      # failed step already failed the job, and always() only adds this step, it
      # does not reset the job status. For the same reason the step is tolerant of
      # a missing report (a build that died before configure never wrote one) and
      # says so instead of erroring: the requirement that a *successful* build
      # produce a report is enforced by the assertion steps above, which do not
      # carry always().
      - name: Publish release config evidence to the run summary (#202)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os

          path = "idf_app/build/config/rk_release_config.json"
          out = ["### Release config gate (#202)", ""]
          if not os.path.isfile(path):
              out += ["No `rk_release_config.json` was produced: the build did not reach "
                      "the configure-time gate. See the failing step above.", ""]
          else:
              with open(path, encoding="utf-8") as fh:
                  r = json.load(fh)

              # The invariant deliberately accepts SIZE or PERF, so "verdict: pass"
              # does not say WHICH mode shipped. Resolve it from the recorded rows
              # rather than from the defaults file, which is an input, not evidence.
              mode = "unresolved"
              for row in r.get("invariants") or []:
                  if row.get("name") == "COMPILER_OPTIMIZATION":
                      actual = row.get("actual")
                      if isinstance(actual, dict):
                          on = [k for k, v in sorted(actual.items()) if v is True]
                          mode = ", ".join(on) if on else "none selected"
                      else:
                          mode = str(actual)
              rows = [
                  ("optimization mode", mode),
                  ("verdict", r.get("verdict")),
                  ("enforced", json.dumps(r.get("enforced"))),
                  ("config digest", r.get("config_digest")),
                  ("tokens", " ".join(r.get("tokens") or [])),
                  ("run", "%s run %s attempt %s" % (os.environ.get("GITHUB_REPOSITORY"),
                                                    os.environ.get("GITHUB_RUN_ID"),
                                                    os.environ.get("GITHUB_RUN_ATTEMPT"))),
                  ("commit", os.environ.get("GITHUB_SHA")),
              ]
              out += ["| field | value |", "|---|---|"]
              out += ["| %s | `%s` |" % (k, v) for k, v in rows]
              out.append("")

          # Static caveat, emitted on the passing, failing and missing-report
          # paths alike. A table of green config fields invites being read as
          # "the published image is correct"; it is not that. Deliberately
          # literal rather than derived from the report, so that it still
          # appears when there is NO report to derive anything from -- which is
          # exactly the run where a reader is most likely to misread the
          # summary. Duplicated verbatim in the `release` job's summary because
          # the two jobs cannot share code; keep them in step.
          # See the ADR's ESPTOOLPY_FLASHSIZE section.
          out += [
              "> **This is a configuration verdict, not image geometry.** The gate checks "
              "IDF's resolved Kconfig configuration against release policy. It does not "
              'validate flash image layout: `sdkconfig.defaults` declares '
              '`CONFIG_ESPTOOLPY_FLASHSIZE="16MB"` while the merged image published by '
              "this workflow is built with `esptool merge-bin --flash-size 8MB`. That "
              "disagreement is real, known, and unresolved pending #203.",
              "",
          ]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(out) + "\n")
          print("\n".join(out))
          PY

      - name: Create merged flash image for web flashing
        run: |
          pip install esptool
          esptool --chip esp32s3 merge-bin \
            -o roon_knob_merged.bin \
            --flash-mode dio --flash-freq 80m --flash-size 8MB \
            0x0 idf_app/build/bootloader/bootloader.bin \
            0x8000 idf_app/build/partition_table/partition-table.bin \
            0xd000 idf_app/build/ota_data_initial.bin \
            0x10000 idf_app/build/roon_knob.bin
          ls -la *.bin

      # if-no-files-found: error is NOT a per-file guarantee. actions/upload-artifact
      # evaluates it once against the combined search result, so with three patterns
      # it fires only when ALL of them match nothing: the report could be absent and
      # the upload would still be green because the two binaries matched. The
      # per-file guarantee has to be made here, explicitly, before the upload.
      - name: Assert every artifact input exists (#202)
        run: |
          set -euo pipefail
          missing=0
          for f in \
            idf_app/build/roon_knob.bin \
            roon_knob_merged.bin \
            idf_app/build/config/rk_release_config.json
          do
            if [ -f "$f" ]; then
              echo "ok      $f ($(wc -c < "$f") bytes)"
            else
              echo "MISSING $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "refusing to upload an incomplete artifact"; exit 1; }

      # rk_release_config.json rides along with the firmware (#202). Note what it
      # does and does not preserve: the verdict, the enforced state, the sha256 of
      # the config that was gated, and one evidence row per invariant -- NOT the
      # full gated configuration, which cannot be reconstructed from it. The
      # resolved sdkconfig.json is deliberately NOT uploaded: artifacts on a public
      # repo are world-downloadable, and that file is exactly where a future
      # sdkconfig.local-style credential would surface, which would undo the
      # checker's own no-echo discipline. The binding between report and binary is
      # same-job provenance plus the per-file assertion above, and the release job
      # re-asserts the report itself.
      # if-no-files-found: error is kept as defence in depth for the zero-match
      # case only; the step above is what guarantees each file.
      - name: Upload ESP32-S3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: |
            idf_app/build/roon_knob.bin
            roon_knob_merged.bin
            idf_app/build/config/rk_release_config.json
          if-no-files-found: error
          retention-days: 30

  # Proves the checker's LOGIC, the host assertion's teeth, and the CMake gate's
  # decision paths. Host-only -- bash, python3, cmake -- no ESP-IDF, no container,
  # seconds. Deliberately independent of build-idf so a failure here is
  # attributable to the gate rather than to the firmware build.
  release-config-fixtures:
    name: release-config-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run checker and host-assertion fixtures (#202)
        run: idf_app/tools/test_check_release_config.sh

      # rk_release_config.cmake is the file that decides whether a violating build
      # actually fails. Its defensive paths (deleted checker, empty output,
      # ';'-splitting, unwritable report, unlaunchable interpreter) are reachable
      # precisely when nobody is watching, so they are tested rather than reasoned
      # about. Runs the real gate under `cmake -P` with IDF's two commands stubbed.
      - name: Run CMake gate fixtures (#202)
        run: idf_app/tools/test_release_config_cmake.sh

  # The one integration negative (#202 AC 6). Proves the WIRING: that a stale
  # sdkconfig which silently ignores the committed defaults is caught at configure
  # time by the checker, and rejected for the stated reason. All three conditions
  # are required -- failed step, exact checker token, and a report saying
  # verdict:fail -- so an unrelated compile break or container hiccup cannot be
  # mistaken for the gate firing.
  build-stale-config:
    name: build-stale-config
    runs-on: ubuntu-latest
    # Also an initial ceiling. Two SEQUENTIAL container runs share one image pull:
    # run 1 aborts at the gate within seconds (its failing target has no
    # dependencies, so ninja stops almost immediately and compiles almost
    # nothing), which means run 2 is effectively a full build rather than an
    # incremental one. Exact-head run 30524500149 observed 3m38s here versus
    # 3m45s for build-idf, so the serial pair has not measured slower in practice.
    # 60 remains a deliberately conservative failure ceiling for cold-pull and
    # runner variance, not a claim that the job takes twice as long. Tighten it
    # after enough runs establish the variance (see the ADR).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A FAITHFUL stale tree: a full copy of the committed defaults with ONLY the
      # optimization selection regressed to what a pre-#202 developer tree carried.
      #
      # This matters more than it looks. An earlier version of this job seeded a
      # three-line sdkconfig, which -- because a stale sdkconfig overrides defaults
      # -- also dropped PSRAM, the custom partition table and the flash size, so the
      # build could not link for reasons that had nothing to do with the gate. The
      # job went red either way and proved only that the checker noticed. Keeping
      # every other setting identical makes the gate the sole possible cause of
      # failure, which is the only way the ON/OFF pair below means anything.
      #
      # Seeded BEFORE any configure. `idf.py set-target` must never be used here:
      # it renames an existing sdkconfig to sdkconfig.old, which would silently
      # destroy the very condition under test. The action only exports IDF_TARGET.
      # MODE-AGNOSTIC on purpose. The gate accepts SIZE or PERF so that a
      # hardware-driven switch in #203 is a one-line sdkconfig.defaults diff; if
      # this seed matched the literal SIZE line, that switch would also require a
      # workflow edit -- and because this job gates tagging, forgetting it would
      # block a release. Matching whichever release mode is selected keeps the
      # one-line claim true, while `swapped == 1` keeps the tripwire: two selected
      # modes, or none, still stops the job.
      - name: Seed a faithful stale tree, differing only in the optimization choice
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          src, dst = "idf_app/sdkconfig.defaults", "idf_app/sdkconfig"
          selected = re.compile(r"^CONFIG_COMPILER_OPTIMIZATION_(SIZE|PERF)=y$")
          out, swapped, was = [], 0, None
          with open(src, encoding="utf-8") as fh:
              for line in fh:
                  m = selected.match(line.strip())
                  if m:
                      was = m.group(1)
                      out += ["CONFIG_COMPILER_OPTIMIZATION_DEBUG=y\n",
                              "# CONFIG_COMPILER_OPTIMIZATION_SIZE is not set\n",
                              "# CONFIG_COMPILER_OPTIMIZATION_PERF is not set\n",
                              "# CONFIG_COMPILER_OPTIMIZATION_NONE is not set\n"]
                      swapped += 1
                  else:
                      out.append(line)
          assert swapped == 1, \
              "expected exactly one selected release mode (SIZE or PERF) in %s, found %d" \
              % (src, swapped)
          with open(dst, "w", encoding="utf-8") as fh:
              fh.writelines(out)
          print("seeded %s from %s, regressing %s -> DEBUG" % (dst, src, was))
          PY
          echo "--- optimization selection in the seeded tree ---"
          grep -n 'COMPILER_OPTIMIZATION' idf_app/sdkconfig
          echo "--- everything else must be byte-identical to the defaults ---"
          diff <(grep -v 'COMPILER_OPTIMIZATION' idf_app/sdkconfig.defaults) \
               <(grep -v 'COMPILER_OPTIMIZATION' idf_app/sdkconfig)
          echo "seed differs from committed defaults only in the optimization choice"

      # LIVENESS CANARY for the one determination this gate delegates rather than
      # computes. The undefined-symbol verdict is kconfgen's, read out of the build
      # log by regex -- so a future esp-idf-kconfig (the constraint allows anything
      # <3.0.0) could reword that diagnostic and the checker would silently return
      # "nothing found" forever. That would also disarm the brownout-alias drift
      # alarm the ADR promises. A recorded fixture cannot detect it; only the live
      # toolchain can.
      #
      # Ordering is load-bearing and must not be rearranged:
      #   * AFTER the seed/diff step, so the byte-identity assertion is unaffected
      #   * BEFORE run 1, so the #149 staleness guard sees the same defaults hash
      #     on both runs (appending between the runs would trip its FATAL_ERROR in
      #     run 2 and break the control for the wrong reason)
      #   * appended to sdkconfig.defaults, never to sdkconfig: an unknown symbol
      #     never reaches sdkconfig.json, so both runs still resolve an identical
      #     effective config and the digest-equality control is preserved
      # The value is a sentinel so the no-echo discipline can be proven against
      # real kconfgen output, not just against a fixture. Test-only: this line is
      # appended to the CI checkout and is never committed.
      - name: Arm the kconfgen undefined-symbol liveness canary (test-only)
        run: |
          set -euo pipefail
          grep -q 'RK_CANARY_UNDEFINED_SYMBOL' idf_app/sdkconfig.defaults \
            && { echo "canary must never be committed to sdkconfig.defaults"; exit 1; } || true
          printf '%s\n' \
            '' \
            '# TEST-ONLY canary appended by CI (build-stale-config), never committed.' \
            'CONFIG_RK_CANARY_UNDEFINED_SYMBOL="rk-canary-value-must-not-be-echoed"' \
            >> idf_app/sdkconfig.defaults
          tail -3 idf_app/sdkconfig.defaults
          echo "--- sdkconfig (the seeded tree) must NOT carry the canary ---"
          ! grep -q 'RK_CANARY_UNDEFINED_SYMBOL' idf_app/sdkconfig

      # Run 1: enforcement ON. Must fail, and must fail AT THE GATE.
      - name: Run 1 of 2 - enforcement ON (expected to FAIL)
        id: enforced
        continue-on-error: true
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.4
          target: esp32s3
          path: idf_app
          command: >-
            set -o pipefail;
            idf.py -DRK_ENFORCE_RELEASE_CONFIG=ON build 2>&1 | tee rk-stale-on.log;
            exit ${PIPESTATUS[0]}

      # Run 2 reconfigures the same tree and rewrites the report, so run 1's
      # evidence is copied out first. Host-side reads of container-written files
      # are fine; only writes into build/ are not.
      - name: Preserve run 1 evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stale"
          cp idf_app/build/config/rk_release_config.json "$RUNNER_TEMP/stale/report-on.json"
          cp idf_app/build/config/sdkconfig.json "$RUNNER_TEMP/stale/sdkconfig-on.json"
          ls -l "$RUNNER_TEMP/stale"

      - name: Assert run 1 failed at the gate, for the stated reason
        run: |
          set -euo pipefail
          if [ "${{ steps.enforced.outcome }}" != "failure" ]; then
            echo "FAIL: enforcement ON did not fail the seeded stale build (outcome=${{ steps.enforced.outcome }})"
            exit 1
          fi
          echo "--- required violation token ---"
          grep -F 'RK-RELCFG-VIOLATION: COMPILER_OPTIMIZATION_DEBUG' idf_app/rk-stale-on.log
          echo "--- required enforcement banner ---"
          grep -F 'RK-RELCFG-ENFORCED' idf_app/rk-stale-on.log
          echo "--- required report verdict ---"
          python3 idf_app/tools/assert_release_report.py \
            --report "$RUNNER_TEMP/stale/report-on.json" \
            --config "$RUNNER_TEMP/stale/sdkconfig-on.json" \
            --expect-enforced true \
            --expect-verdict fail

      # The canary, read back out of the log the live toolchain actually wrote.
      # Exit 4 is required exactly: UNDEFINED outranks the VIOLATION this tree also
      # has, so a 2 here would mean kconfgen's wording changed and the delegated
      # determination has gone silent.
      - name: Assert kconfgen's undefined-symbol determination is still live
        run: |
          set -euo pipefail
          set +e
          out=$(python3 idf_app/tools/check_release_config.py \
                  --config "$RUNNER_TEMP/stale/sdkconfig-on.json" \
                  --log idf_app/rk-stale-on.log \
                  --log-must-contain 'RK-RELCFG-VERDICT:' 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 4 ]; then
            echo "FAIL: expected exit 4 (RK-RELCFG-UNDEFINED) from the live canary, got $rc."
            echo "      kconfgen's unknown-symbol wording may have changed, which would"
            echo "      silently disable the delegated undefined-symbol determination."
            exit 1
          fi
          printf '%s' "$out" | grep -F 'RK-RELCFG-UNDEFINED: CONFIG_RK_CANARY_UNDEFINED_SYMBOL'
          echo "--- and the assigned value must never be echoed ---"
          if printf '%s' "$out" | grep -qF 'rk-canary-value-must-not-be-echoed'; then
            echo "FAIL: the checker echoed an assigned value from the log"
            exit 1
          fi
          echo "live kconfgen verdict consumed; symbol named, value withheld"

      # Run 2: the POSITIVE CONTROL. Identical tree, identical violating config,
      # enforcement OFF -- and it must build all the way through. No
      # continue-on-error: if this run fails, something other than the gate was
      # stopping the build, and the negative proof above would have been worthless.
      - name: Run 2 of 2 - identical tree, enforcement OFF (expected to SUCCEED)
        id: unenforced
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.4
          target: esp32s3
          path: idf_app
          command: >-
            set -o pipefail;
            idf.py -DRK_ENFORCE_RELEASE_CONFIG=OFF build 2>&1 | tee rk-stale-off.log;
            exit ${PIPESTATUS[0]}

      # The pair is the proof: same tree, same resolved config, same fail verdict,
      # opposite outcomes. That makes fail_at_build_time() the sole difference
      # between a shipped artifact and a blocked one -- demonstrated, not assumed.
      - name: Assert run 2 succeeded, unenforced, on the same violating config
        run: |
          set -euo pipefail
          cp idf_app/build/config/rk_release_config.json "$RUNNER_TEMP/stale/report-off.json"
          echo "--- required NOT ENFORCED banner ---"
          grep -F '*** RELEASE CONFIG INVARIANTS NOT ENFORCED' idf_app/rk-stale-off.log
          echo "--- the unenforced build really produced firmware ---"
          test -f idf_app/build/roon_knob.bin
          ls -l idf_app/build/roon_knob.bin
          echo "--- report still records the violation, unenforced ---"
          python3 idf_app/tools/assert_release_report.py \
            --report "$RUNNER_TEMP/stale/report-off.json" \
            --config idf_app/build/config/sdkconfig.json \
            --expect-enforced false \
            --expect-verdict fail
          echo "--- enforcement is the ONLY difference between the two runs ---"
          python3 - <<'PY'
          import json, os
          base = os.path.join(os.environ["RUNNER_TEMP"], "stale")
          on = json.load(open(os.path.join(base, "report-on.json"), encoding="utf-8"))
          off = json.load(open(os.path.join(base, "report-off.json"), encoding="utf-8"))
          assert on["config_digest"] == off["config_digest"], \
              "the two runs resolved DIFFERENT configs (%s vs %s): not a controlled pair" \
              % (on["config_digest"], off["config_digest"])
          assert on["verdict"] == "fail" and off["verdict"] == "fail", (on["verdict"], off["verdict"])
          assert on["enforced"] is True and off["enforced"] is False, (on["enforced"], off["enforced"])
          print("same resolved config : %s" % on["config_digest"])
          print("same verdict         : fail")
          print("enforced ON  -> build FAILED  (fail_at_build_time fired)")
          print("enforced OFF -> build SUCCEEDED with firmware produced")
          print("fail_at_build_time is load-bearing.")
          PY

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # The negative-proof jobs must REQUIRE, not merely produce, evidence (#202):
    # publishing firmware while the jobs that prove the gate works are red would
    # make "CI's enforcement is provable" true of the build and false of the
    # release. Neither dependency carries an `if:` event guard, deliberately -- a
    # skipped dependency skips this job too, so an event-guarded prerequisite
    # would silently un-gate tag builds. Both therefore run on every event, which
    # costs one extra container build per push; that is the price of a graph whose
    # semantics do not depend on reading GitHub's skip rules correctly.
    needs: [build-idf, release-config-fixtures, build-stale-config]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download ESP32-S3 firmware
        uses: actions/download-artifact@v4
        with:
          name: esp32s3-firmware
          path: esp32s3-artifacts

      # Gate the publish on the artifact's own evidence (#202), not on the memory
      # of a green job. build-idf is already a `needs:` prerequisite, but this
      # asserts the thing being published: that the config the release was built
      # from passed the gate with enforcement on. The digest is recorded in the run
      # summary so "which config did v1.x.y ship?" is answerable from the release
      # run itself. This job checks out the repo above, so the asserter is present;
      # python3 is preinstalled on ubuntu-latest.
      - name: Assert the downloaded artifact carries a passing gate report (#202)
        run: |
          set -euo pipefail
          report=esp32s3-artifacts/idf_app/build/config/rk_release_config.json
          test -f "$report" || { echo "artifact has no $report - refusing to publish"; exit 1; }
          python3 idf_app/tools/assert_release_report.py \
            --report "$report" \
            --expect-enforced true \
            --expect-verdict pass \
            --forbid-absent-satisfied
          python3 - <<'PY'
          import json, os
          with open("esp32s3-artifacts/idf_app/build/config/rk_release_config.json",
                    encoding="utf-8") as fh:
              r = json.load(fh)
          mode = "unresolved"
          for row in r.get("invariants") or []:
              if row.get("name") == "COMPILER_OPTIMIZATION" and isinstance(row.get("actual"), dict):
                  on = [k for k, v in sorted(row["actual"].items()) if v is True]
                  mode = ", ".join(on) if on else "none selected"
          rows = [("release tag", os.environ.get("GITHUB_REF_NAME")),
                  ("optimization mode", mode),
                  ("verdict", r.get("verdict")),
                  ("enforced", json.dumps(r.get("enforced"))),
                  ("config digest", r.get("config_digest"))]
          out = ["### Published firmware release config (#202)", "",
                 "| field | value |", "|---|---|"]
          out += ["| %s | `%s` |" % (k, v) for k, v in rows]
          out.append("")
          # Same static caveat as build-idf's summary, and it matters most here:
          # this is the table someone reads when asking "what did v1.x.y ship?",
          # so a green config verdict must not be mistaken for a validated flash
          # image while the 16MB/8MB disagreement is open. Kept in step with the
          # copy in build-idf.
          out += [
              "> **This is a configuration verdict, not image geometry.** The gate checks "
              "IDF's resolved Kconfig configuration against release policy. It does not "
              'validate flash image layout: `sdkconfig.defaults` declares '
              '`CONFIG_ESPTOOLPY_FLASHSIZE="16MB"` while the merged image published by '
              "this workflow is built with `esptool merge-bin --flash-size 8MB`. That "
              "disagreement is real, known, and unresolved pending #203.",
              "",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(out) + "\n")
          print("\n".join(out))
          PY

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get release notes from draft
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Try to get draft release body (maintained by release-drafter)
          DRAFT_BODY=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.draft == true) | .body' 2>/dev/null | head -1 || echo "")

          # Check if draft has actual PR content (not just empty template)
          if [ -n "$DRAFT_BODY" ] && echo "$DRAFT_BODY" | grep -q "github.com.*pull"; then
            echo "$DRAFT_BODY" > release_notes.md
            echo "Using draft release notes from release-drafter"
          else
            # Fallback: generate notes via GitHub API
            echo "Draft empty or no PRs, generating from GitHub API..."
            # Get previous tag via GitHub API (more reliable than git in shallow clones)
            PREV_TAG=$(gh api repos/${{ github.repository }}/tags --jq '.[].name' | grep '^v' | sort -V | grep -B1 "^${{ github.ref_name }}$" | head -1)
            if [ "$PREV_TAG" = "${{ github.ref_name }}" ]; then
              # Current tag is oldest, no previous
              PREV_TAG=""
            fi
            echo "Previous tag: $PREV_TAG"
            if [ -n "$PREV_TAG" ]; then
              gh api repos/${{ github.repository }}/releases/generate-notes \
                -f tag_name="${{ github.ref_name }}" \
                -f previous_tag_name="$PREV_TAG" \
                --jq '.body' > release_notes.md 2>/dev/null || echo "## What's Changed" > release_notes.md
            else
              echo "## What's Changed" > release_notes.md
            fi
            echo "Generated release notes"
          fi
          echo "--- Release notes content ---"
          cat release_notes.md

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp esp32s3-artifacts/idf_app/build/roon_knob.bin release-assets/
          cp esp32s3-artifacts/roon_knob_merged.bin release-assets/
          ls -la release-assets/

      - name: Build release body
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Start with auto-generated "What's Changed"
          cat release_notes.md > final_body.md

          # Append template with version substituted
          sed "s/{{VERSION}}/$VERSION/g" .github/RELEASE_TEMPLATE.md >> final_body.md

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_EXISTS=$(gh release view ${{ github.ref_name }} --json assets --jq '.assets | length' 2>/dev/null || echo "0")
          echo "existing_assets=$RELEASE_EXISTS" >> $GITHUB_OUTPUT
          if [ "$RELEASE_EXISTS" -gt "0" ]; then
            echo "Release already exists with $RELEASE_EXISTS assets, will only upload missing files"
          fi

      - name: Create or Update Release
        if: steps.check_release.outputs.existing_assets == '0'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            release-assets/roon_knob.bin
            release-assets/roon_knob_merged.bin
          body_path: final_body.md

      - name: Upload assets to existing release
        if: steps.check_release.outputs.existing_assets != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload any missing assets
          for file in release-assets/*; do
            filename=$(basename "$file")
            if ! gh release view ${{ github.ref_name }} --json assets --jq ".assets[].name" | grep -q "^${filename}$"; then
              echo "Uploading $filename..."
              gh release upload ${{ github.ref_name }} "$file" --clobber
            else
              echo "$filename already exists, skipping"
            fi
          done

  # NOTE: Docker builds moved to unified-hifi-control repo
  # The muness/unified-hifi-control and muness/roon-extension-knob images
  # are now built from https://github.com/cloud-atlas-ai/unified-hifi-control

  deploy-pr-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    # Same three prerequisite jobs as `release`, deliberately identical (the
    # job-graph decision in #207): a preview is flashed to real hardware by whoever
    # opens the PR link, so it should not come from a tree whose checker logic is
    # broken (release-config-fixtures) OR whose proof that the gate actually BLOCKS
    # is failing (build-stale-config). This is prerequisite parity, not complete
    # artifact-validation parity: `release` re-asserts the downloaded report while
    # this job does not yet; #210 owns that caller-workflow gap.
    # An earlier revision needed only the first two, on the grounds that the
    # container-heavy job would delay every preview -- but build-stale-config
    # already runs in every triggered workflow, including every pull-request run,
    # so requiring it adds waiting, not a build. It also removes the asymmetry
    # where a red wiring proof stopped a release but not a publicly flashable
    # preview.
    needs: [build-idf, release-config-fixtures, build-stale-config]
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download ESP32-S3 firmware
        uses: actions/download-artifact@v4
        with:
          name: esp32s3-firmware
          path: esp32s3-artifacts

      - name: Prepare PR preview content
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p pr-preview

          # Copy firmware
          cp esp32s3-artifacts/roon_knob_merged.bin pr-preview/

          # Create PR-specific manifest
          cat > pr-preview/manifest-s3.json << EOF
          {
            "name": "Roon Knob (PR #${PR_NUM} Preview)",
            "version": "pr-${PR_NUM}",
            "new_install_prompt_erase": true,
            "builds": [{
              "chipFamily": "ESP32-S3",
              "parts": [{
                "path": "roon_knob_merged.bin",
                "offset": 0
              }]
            }]
          }
          EOF

          # Create PR flash page from template
          sed "s/{{PR_NUMBER}}/${PR_NUM}/g" web/flash-pr.html > pr-preview/flash.html

          echo "PR preview contents:"
          ls -la pr-preview/

      - name: Deploy PR preview to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pr-preview
          destination_dir: pr/${{ github.event.pull_request.number }}
          keep_files: true

      - name: Post preview URL to PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://roon-knob.muness.com/pr/${prNumber}/flash.html`;

            // Check if we already posted a comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Firmware Preview')
            );

            const body = `### Firmware Preview

            Flash this PR's firmware directly in your browser:
            **${previewUrl}**

            _Updated: ${new Date().toISOString()}_`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download ESP32-S3 firmware
        uses: actions/download-artifact@v4
        with:
          name: esp32s3-firmware
          path: esp32s3-artifacts

      - name: Prepare gh-pages content
        run: |
          mkdir -p gh-pages-build
          cp web/index.html gh-pages-build/
          cp web/flash.html gh-pages-build/
          cp web/manifest-s3.json gh-pages-build/
          cp esp32s3-artifacts/roon_knob_merged.bin gh-pages-build/
          echo "roon-knob.muness.com" > gh-pages-build/CNAME
          ls -la gh-pages-build/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-build
